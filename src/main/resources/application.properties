spring.application.name=backend

# MySQL Database (supports local and containerized environments)
# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}
server.address=0.0.0.0
# JWT
jwt.secret=${JWT_SECRET:smartpg-secret-key-change-this-to-a-long-random-secret-key-2026}

# Initial System Administrator Provisioning (configurable via environment variables)
app.admin.email=${ADMIN_EMAIL:admin@smartpg.com}
app.admin.password=${ADMIN_PASSWORD:password123}
app.admin.name=${ADMIN_NAME:System Administrator}